apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - edge.yaml
# tls.crt and tls.key are the machine CA's, written beside this file by
# setup; renew re-applies them.
secretGenerator:
  - name: edge-tls
    namespace: dotvirt-edge
    type: kubernetes.io/tls
    files:
      - tls.crt
      - tls.key
generatorOptions:
  disableNameSuffixHash: true
