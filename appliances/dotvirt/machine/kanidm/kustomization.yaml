apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kanidm.yaml
# Kanidm terminates TLS itself, so it holds its own certificate: the edge's
# key stays in dotvirt-edge.
secretGenerator:
  - name: idm-tls
    namespace: kanidm
    type: kubernetes.io/tls
    files:
      - tls.crt
      - tls.key
generatorOptions:
  disableNameSuffixHash: true
