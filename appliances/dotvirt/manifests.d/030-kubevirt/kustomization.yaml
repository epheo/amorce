apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kubevirt-operator.yaml
# Upstream sizes for two of everything; one machine runs one.
patches:
  - target: {kind: Deployment, name: virt-operator}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
