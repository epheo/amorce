# The installer's own images: amorce, the live system its ISO boots and the
# tool that writes ISOs (amorce iso); amorce-console, the installed console's
# files alone, which the distro copies. Pull requests build them; main
# publishes them, signed.
name: installer

on:
  push:
    branches: [main]
    paths-ignore: ["appliances/**"]
  pull_request:
    paths-ignore: ["appliances/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/epheo/amorce
  CONSOLE: ghcr.io/epheo/amorce-console
  # dotvirt's proven version: containers/image, so bootc and CRI-O, reads
  # only the legacy .sig tag with a Rekor v1 SET.
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: installer-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Root, as the distro's CI builds bootc images.
      - name: build
        run: |
          labels=(--label org.opencontainers.image.source=https://github.com/epheo/amorce
            --label org.opencontainers.image.revision="$GITHUB_SHA")
          sudo podman build "${labels[@]}" --target console -t "$CONSOLE:$GITHUB_SHA" .
          sudo podman build "${labels[@]}" -t "$IMAGE:$GITHUB_SHA" .
      - name: what the distro copies is there
        run: |
          sudo podman create --name console "$CONSOLE:$GITHUB_SHA" /none >/dev/null
          sudo podman export console | tar -t > "$RUNNER_TEMP/console-files"
          for f in usr/bin/amorce usr/share/amorce/dist/amorce-console.service usr/share/amorce/dist/amorce.xml \
            usr/share/amorce/console-16.psf usr/share/amorce/console-32.psf; do
            grep -qx "$f" "$RUNNER_TEMP/console-files" || { echo "$CONSOLE lacks $f"; exit 1; }
          done
      - name: publish, signed
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum -c --quiet -
          chmod 755 "$RUNNER_TEMP/bin/cosign"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # cosign's login, named outright: skopeo stops at the unreadable
          # auth file root podman left under /run/user instead of falling back.
          auth=(--authfile "$HOME/.docker/config.json")
          publish() { # publish <image>: :<sha> by digest, signed, verified, then latest
            local digest="$RUNNER_TEMP/${1##*/}.digest" ref
            sudo podman push --digestfile "$digest" "$1:$GITHUB_SHA"
            ref="$1@$(cat "$digest")"
            # The legacy layout: containers/image, so bootc and CRI-O, reads
            # only that one.
            cosign sign --yes --recursive --use-signing-config=false --new-bundle-format=false "$ref"
            cosign verify --new-bundle-format=false \
              --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
            # latest last, as the very digest signed: never an unsigned or
            # re-encoded image under it.
            skopeo copy --preserve-digests "${auth[@]}" "docker://$ref" "docker://$1:latest"
            [ "$(skopeo inspect "${auth[@]}" --format '{{.Digest}}' "docker://$1:latest")" = "$(cat "$digest")" ]
            echo "$ref, signed by $GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF, is latest" >> "$GITHUB_STEP_SUMMARY"
          }
          publish "$CONSOLE"
          publish "$IMAGE"
